name: Build WelcomeMessage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WelcomeMessage.csproj

      - name: Build
        run: dotnet build WelcomeMessage.csproj --configuration Release --no-restore

      - name: Prepare plugin
        run: |
          mkdir -p artifact
          cp bin/Release/net10.0/WelcomeMessage.dll artifact/

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: WelcomeMessage
          path: artifact/WelcomeMessage.dll